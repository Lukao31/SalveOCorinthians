<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <filter id="safielGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Símbolo da SAFiel: Escudo popular com listras alvinegras e engrenagem de governança -->
  <g transform="translate(10, 10)">
    <!-- Fundo preto do emblema -->
    <rect x="0" y="0" width="70" height="70" rx="14" fill="#0c0c0c" stroke="#ffffff" stroke-width="2.5" filter="url(#safielGlow)"/>
    
    <!-- Silhueta da torcida / estrelas populares -->
    <path d="M 20 48 C 24 38, 46 38, 50 48 Z" fill="#ffffff" />
    <circle cx="35" cy="33" r="7" fill="#ffffff" />
    
    <!-- Anel popular com 5 pontos representando os 35 milhões -->
    <circle cx="35" cy="35" r="24" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="20" cy="20" r="2.5" fill="#ffffff"/>
    <circle cx="50" cy="20" r="2.5" fill="#ffffff"/>
    <circle cx="35" cy="58" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Tipografia Oficial SAFiel -->
  <g transform="translate(95, 12)">
    <text x="0" y="38" font-family="'Montserrat', sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="1">
      SAF<tspan fill="#a0a0a0">iel</tspan>
    </text>
    <text x="2" y="58" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#ffffff" letter-spacing="2">
      A SAF DO POVO CORINTHIANO
    </text>
    <text x="2" y="72" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#777777" letter-spacing="1">
      safiel.com.br • O CONTROLE DA FIEL
    </text>
  </g>
</svg>
