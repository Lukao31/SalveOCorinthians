<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradientes Oficiais Alvinegros, Carmesim e Ouro -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#604600"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>

    <linearGradient id="redCorinthians" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c"/>
      <stop offset="45%" stop-color="#c90016"/>
      <stop offset="100%" stop-color="#80000a"/>
    </linearGradient>

    <linearGradient id="oarWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="50%" stop-color="#9d0208"/>
      <stop offset="100%" stop-color="#590004"/>
    </linearGradient>

    <linearGradient id="blackShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="50%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.25"/>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#ffd700" flood-opacity="0.8"/>
    </filter>

    <!-- Caminho curvo para o texto circular superior -->
    <path id="textArcTop" d="M 36 100 A 64 64 0 0 1 164 100" fill="none"/>
    <!-- Caminho curvo para o texto circular inferior -->
    <path id="textArcBottom" d="M 164 100 A 64 64 0 0 1 36 100" fill="none"/>
  </defs>

  <g filter="url(#emblemGlow)">
    <!-- ================================================================
         1. REMOS NÁUTICOS CRUZADOS (História de Francisco Rebolo - 1939)
         ================================================================ -->
    <!-- Ramo 1: Diagonal Noroeste para Sudeste (45°) -->
    <g transform="rotate(45 100 100)">
      <!-- Haste -->
      <rect x="96.5" y="10" width="7" height="180" rx="3.5" fill="url(#oarWood)" stroke="#ffffff" stroke-width="1.2"/>
      <!-- Pá Superior -->
      <path d="M 94 8 C 94 4, 106 4, 106 8 L 108 30 C 108 33, 92 33, 92 30 Z" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="100" y1="8" x2="100" y2="28" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <!-- Pá Inferior -->
      <path d="M 94 192 C 94 196, 106 196, 106 192 L 108 170 C 108 167, 92 167, 92 170 Z" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="100" y1="192" x2="100" y2="172" stroke="url(#goldGrad)" stroke-width="1.2"/>
    </g>

    <!-- Ramo 2: Diagonal Nordeste para Sudoeste (-45°) -->
    <g transform="rotate(-45 100 100)">
      <!-- Haste -->
      <rect x="96.5" y="10" width="7" height="180" rx="3.5" fill="url(#oarWood)" stroke="#ffffff" stroke-width="1.2"/>
      <!-- Pá Superior -->
      <path d="M 94 8 C 94 4, 106 4, 106 8 L 108 30 C 108 33, 92 33, 92 30 Z" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="100" y1="8" x2="100" y2="28" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <!-- Pá Inferior -->
      <path d="M 94 192 C 94 196, 106 196, 106 192 L 108 170 C 108 167, 92 167, 92 170 Z" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="100" y1="192" x2="100" y2="172" stroke="url(#goldGrad)" stroke-width="1.2"/>
    </g>

    <!-- ================================================================
         2. ÂNCORA NÁUTICA CORINTHIANA
         ================================================================ -->
    <!-- Anel Superior da Âncora -->
    <circle cx="100" cy="24" r="11" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <circle cx="100" cy="24" r="6" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Braço Transversal Superior da Âncora -->
    <rect x="68" y="36" width="64" height="6" rx="2.5" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="69" cy="39" r="4" fill="url(#goldGrad)"/>
    <circle cx="131" cy="39" r="4" fill="url(#goldGrad)"/>

    <!-- Haste Vertical da Âncora -->
    <rect x="96.5" y="28" width="7" height="144" rx="2" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Arco Inferior da Âncora com Unhas Triangulares -->
    <path d="M 46 138 C 58 176, 142 176, 154 138" fill="none" stroke="url(#redCorinthians)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 46 138 C 58 176, 142 176, 154 138" fill="none" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Pontas / Unhas da Âncora -->
    <polygon points="44,142 34,130 50,131" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1"/>
    <polygon points="156,142 166,130 150,131" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1"/>

    <!-- ================================================================
         3. A BÓIA SALVA-VIDAS ALVINEGRA (Símbolo de "SALVE O CORINTHIANS")
         ================================================================ -->
    <!-- Borda Externa Dourada da Bóia -->
    <circle cx="100" cy="100" r="67" fill="#000000" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Anel da Bóia Salva-vidas em Branco Puro -->
    <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff" stroke-width="10"/>

    <!-- 4 Tiras Tradicionais de Salvamento Alvinegras com Vermelho -->
    <rect x="96" y="38" width="8" height="10" fill="url(#redCorinthians)" rx="1"/>
    <rect x="96" y="152" width="8" height="10" fill="url(#redCorinthians)" rx="1"/>
    <rect x="38" y="96" width="10" height="8" fill="url(#redCorinthians)" rx="1"/>
    <rect x="152" y="96" width="10" height="8" fill="url(#redCorinthians)" rx="1"/>

    <!-- Cordas de Amortecimento nos 4 Quadrantes -->
    <path d="M 52 62 C 60 48, 80 44, 94 43" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 106 43 C 120 44, 140 48, 148 62" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 148 138 C 140 152, 120 156, 106 157" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 94 157 C 80 156, 60 152, 52 138" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Anel Interno Preto com Inscrições Douradas -->
    <circle cx="100" cy="100" r="54" fill="url(#blackShield)" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Inscrição Superior Circular: "SALVE O CORINTHIANS" -->
    <text font-family="'Montserrat', sans-serif" font-weight="900" font-size="8.8" fill="url(#goldLight)" letter-spacing="2">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        SALVE O CORINTHIANS
      </textPath>
    </text>

    <!-- Inscrição Inferior Circular: "★ 1910 ★" -->
    <text font-family="'Montserrat', sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" letter-spacing="3">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        ★ 1910 ★
      </textPath>
    </text>

    <!-- ================================================================
         4. O BRASÃO CENTRAL CLÁSSICO DO TIMÃO
         ================================================================ -->
    <!-- Contorno do Escudo Menor -->
    <path d="M 72 74 C 72 70, 100 68, 100 68 C 100 68, 128 70, 128 74 L 128 102 C 128 118, 100 130, 100 130 C 100 130, 72 118, 72 102 Z"
          fill="url(#blackShield)" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Fundo das Listras Alvinegras do Corinthians -->
    <g clip-path="url(#shieldClip)">
      <path d="M 74 76 L 126 76 L 126 102 C 126 116, 100 127, 100 127 C 100 127, 74 116, 74 102 Z" id="innerShieldPath" fill="#000000"/>
    </g>

    <!-- Bandeira de São Paulo Estilizada (13 Listras Preto & Branco) -->
    <g transform="translate(75, 76)">
      <!-- 13 Listras horizontais proporcionais -->
      <rect x="0" y="0" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="3" width="50" height="3" fill="#000000"/>
      <rect x="0" y="6" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="9" width="50" height="3" fill="#000000"/>
      <rect x="0" y="12" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="15" width="50" height="3" fill="#000000"/>
      <rect x="0" y="18" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="21" width="50" height="3" fill="#000000"/>
      <rect x="0" y="24" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="27" width="50" height="3" fill="#000000"/>
      <rect x="0" y="30" width="50" height="3" fill="#ffffff"/>
      <rect x="0" y="33" width="50" height="3" fill="#000000"/>
      <rect x="0" y="36" width="50" height="3" fill="#ffffff"/>

      <!-- Cantão Vermelho no Canto Superior Esquerdo -->
      <rect x="0" y="0" width="20" height="15" fill="url(#redCorinthians)" stroke="#ffffff" stroke-width="0.8"/>
      <!-- Círculo Branco com Estrela Central -->
      <circle cx="10" cy="7.5" r="4.5" fill="#ffffff"/>
      <circle cx="10" cy="7.5" r="3.2" fill="url(#redCorinthians)"/>
      <polygon points="10,5 11,7 13,7 11.5,8.2 12,10.2 10,9 8,10.2 8.5,8.2 7,7 9,7" fill="url(#goldLight)"/>
    </g>

    <!-- Moldura de acabamento do escudo central com bico perfeito -->
    <path d="M 74 76 C 74 72, 100 70, 100 70 C 100 70, 126 72, 126 76 L 126 102 C 126 116, 100 127, 100 127 C 100 127, 74 116, 74 102 Z"
          fill="none" stroke="#ffffff" stroke-width="1.8"/>

    <!-- ================================================================
         5. ESTRELAS DAS GLÓRIAS E MUNDIAIS (Topo do Emblema)
         ================================================================ -->
    <!-- Grande Estrela Dourada Central do Mundial -->
    <g filter="url(#starGlow)">
      <polygon points="100,5 103,13 111,13.5 105,19 107,27 100,22.5 93,27 95,19 89,13.5 97,13"
               fill="url(#goldLight)" stroke="#ffffff" stroke-width="0.8"/>
    </g>

    <!-- Estrela Dourada Esquerda (Libertadores) -->
    <polygon points="78,16 79.8,21.5 85.5,22 81,25.5 82.5,31 78,28 73.5,31 75,25.5 70.5,22 76.2,21.5"
             fill="url(#goldGrad)" stroke="#ffffff" stroke-width="0.6"/>

    <!-- Estrela Dourada Direita (Bicampeonato) -->
    <polygon points="122,16 123.8,21.5 129.5,22 125,25.5 126.5,31 122,28 117.5,31 119,25.5 114.5,22 120.2,21.5"
             fill="url(#goldGrad)" stroke="#ffffff" stroke-width="0.6"/>
  </g>
</svg>
