<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100">
  <defs>
    <!-- Filtros de sombra e brilho sutil -->
    <filter id="corinthiansGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.25" />
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cccccc" />
    </linearGradient>
  </defs>

  <!-- Escudo e Âncora Ícone à Esquerda -->
  <g transform="translate(10, 10)">
    <!-- Círculo externo -->
    <circle cx="40" cy="40" r="38" fill="#080808" stroke="#ffffff" stroke-width="3" filter="url(#corinthiansGlow)"/>
    
    <!-- Remos Cruzados (Vetor simplificado) -->
    <line x1="16" y1="16" x2="64" y2="64" stroke="#888888" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="64" y1="16" x2="16" y2="64" stroke="#888888" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Pá dos remos -->
    <rect x="12" y="12" width="7" height="11" rx="2" transform="rotate(45 15.5 17.5)" fill="#ffffff"/>
    <rect x="61" y="61" width="7" height="11" rx="2" transform="rotate(45 64.5 66.5)" fill="#ffffff"/>
    <rect x="61" y="12" width="7" height="11" rx="2" transform="rotate(-45 64.5 17.5)" fill="#ffffff"/>
    <rect x="12" y="61" width="7" height="11" rx="2" transform="rotate(-45 15.5 66.5)" fill="#ffffff"/>

    <!-- Âncora Central -->
    <circle cx="40" cy="22" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="40" y1="27" x2="40" y2="63" stroke="#ffffff" stroke-width="3"/>
    <line x1="28" y1="33" x2="52" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Curva da âncora -->
    <path d="M 23 52 C 27 66, 53 66, 57 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="21,50 25,50 23,45" fill="#ffffff"/>
    <polygon points="55,50 59,50 57,45" fill="#ffffff"/>

    <!-- Escudo Central do Timão -->
    <path d="M 31 35 L 49 35 C 49 46, 46 53, 40 56 C 34 53, 31 46, 31 35 Z" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Listras do escudo -->
    <line x1="37" y1="38" x2="37" y2="52" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="43" y1="38" x2="43" y2="52" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Estrela Central -->
    <polygon points="40,29 41.5,33 45,33.5 42.5,36 43,39.5 40,37.5 37,39.5 37.5,36 35,33.5 38.5,33" fill="#ffffff"/>
  </g>

  <!-- Tipografia do Logo "SALVE O CORINTHIANS" -->
  <g transform="translate(100, 0)">
    <!-- Linha Superior: SALVE O -->
    <text x="0" y="34" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="4">
      SALVE O
    </text>

    <!-- Linha Principal: CORINTHIANS -->
    <text x="0" y="68" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1.5" filter="url(#corinthiansGlow)">
      CORINTHIANS
    </text>

    <!-- Subtítulo Identitário -->
    <text x="2" y="86" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#a0a0a0" letter-spacing="2.8">
      1910 • MEMÓRIA, FATOS &amp; TRANSPARÊNCIA
    </text>
  </g>
</svg>
